name: Dependabot PR
on: pull_request

permissions:
  pull-requests: write
  issues: write
  repository-projects: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Add a label for dependencies updates
        run: gh pr edit "$PR_URL" --add-label "automerge"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lockfile_changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: NPM Lockfile Changes
        uses: codepunkt/npm-lockfile-changes@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  raid_changes:
    runs-on: ubuntu-latest
    name: Refactoring Detection
      steps:
        - name: Checkout
          uses: actions/checkout@v7
          with:
            fetch-depth: 0
        - name: Refactoring Aware Diff
          uses: rodrigo-brito/refactoring-aware-diff@action
          env:
            LANGUAGE: ${{ github.event.repository.language }} # Supports Java, Javascrit, C and Go.
            REV_BEFORE: ${{ github.event.pull_request.base.sha }}
            REV_AFTER: ${{ github.event.pull_request.head.sha }}
