info:
  name: Update current user
  type: http
  seq: 4

http:
  method: PUT
  url: "{{BASE_URL}}/auth/me"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: name
        value: "{{$randomFullName}}"
      - name: email
        value: "{{$randomEmail}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const authorization = res.getHeader('authorization');
        const [, token] = authorization?.split(' ') ?? [];

        bru.setVar('TOKEN', token);
    - type: tests
      code: |-
        const tv4 = require('tv4');

        test('given the response body when it satisfies the user schema then it is correct', () => {
          const schema = {
            $ref: 'userSchema'
          };

          expect(tv4.validate(res.getBody(), schema)).to.equal(true);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.body
      operator: isJson
    - expression: res.responseTime
      operator: lt
      value: "1000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Update current user profile
