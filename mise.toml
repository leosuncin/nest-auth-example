[tools]
dagger = "latest"
hk = { version = "latest", postinstall = "hk install --mise", depends = "pkl" }
k6 = "latest"
node = { version = "latest", postinstall = "npx corepack enable" }
"npm:@usebruno/cli" = "latest"
"npm:pnpm" = "latest"
"npm:sort-package-json" = "latest"
pkl = "latest"

[hooks]
postinstall = { task = "pnpm-install" }

[settings]
experimental = true
env_shell_expand = true

[env]
POSTGRES_PASSWORD = { age = "" }
NODE_ENV = "development"
PORT = 3000
DATABASE_URL = "postgres://postgres:$POSTGRES_PASSWORD@localhost:5432/postgres"
PACTUM_REQUEST_BASE_URL = "http://localhost:$PORT"
_.file = ".env"
_.path = ["{{config_root}}/node_modules/.bin"]
HK_MISE = 1
APP_SECRET = { age = "" }

[tasks.pnpm-install]
description = "Installs dependencies with pnpm"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "mise.toml"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.test-e2e]
description = "Runs end-to-end tests"
run = "bru run --env-file environments/$NODE_ENV.yml"
dir = "{{ config_root }}/test/e2e"
